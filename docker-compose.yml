version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - CENTRAG_ENV=development
      - CENTRAG_PG_HOST=db
      - CENTRAG_REDIS_URL=redis://redis:6379/0
      - CENTRAG_QDRANT_LOCAL_PATH=/app/data/qdrant
      - CENTRAG_ENABLE_VECTOR=true
      - CENTRAG_LLM_PROVIDER=${CENTRAG_LLM_PROVIDER:-noop}
      - CENTRAG_EMBEDDER_PROVIDER=${CENTRAG_EMBEDDER_PROVIDER:-noop}
      - LLAMA_CLOUD_API_KEY=${LLAMA_CLOUD_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - db
      - redis
    volumes:
      - ./data:/app/data

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=centrag
      - POSTGRES_USER=centrag
      - POSTGRES_PASSWORD=centrag_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
