name: Enterprise CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install bandit safety code-review-graph
        
    - name: Code Formatting & Linting (Ruff & Mypy)
      run: |
        make lint
        
    - name: Enterprise Security Scan (Bandit & Safety)
      run: |
        bandit -r centrag/ -ll -ii
        safety check --full-report
        
    - name: Run Tests
      env:
        CENTRAG_REDIS_URL: redis://localhost:6379/0
        CENTRAG_QDRANT_URL: http://localhost:6333
        CENTRAG_DATABASE_URL: sqlite+aiosqlite:///./test.db
      run: |
        make test-cov

  auto-graph:
    name: Build Structural Review Graph
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install code-review-graph
        run: pip install code-review-graph
      - name: Build Database
        run: python -m code_review_graph build --repo .
      - name: Commit Graph
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .code-review-graph/graph.db
          git commit -m "chore: auto-update code-review-graph [skip ci]" || echo "No changes to commit"
          git push
