name: AI Engineer Evals

on:
  pull_request:
    paths:
      - 'centrag/chunkers/**'
      - 'centrag/retrieval/**'
      - 'centrag/extraction/**'
      - 'centrag/guardrails/**'

jobs:
  run-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          
      - name: Run Golden Dataset Evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}  # Needed for Evaluation LLMs
        run: |
          make eval > eval_results.txt
          
      - name: Comment PR with Eval Results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('eval_results.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "### 🤖 AI Engineering Verification\n\nGolden dataset evaluation completed. Review the metrics below:\n\n```\n" + results + "\n```"
            })
